<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>100 Best Tourist Places to Visit in India — Image Gallery</title>
  <style>
    :root{
      --bg:#0f172a; /* slate-900 */
      --panel:#111827; /* gray-900 */
      --soft:#1f2937; /* gray-800 */
      --muted:#94a3b8; /* slate-400 */
      --text:#e5e7eb; /* gray-200 */
      --accent:#38bdf8; /* sky-400 */
      --accent-2:#a78bfa; /* violet-400 */
      --chip:#0ea5e9; /* sky-600 */
      --danger:#ef4444;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;
      background:linear-gradient(180deg,#0b1227 0%, #0f172a 70%);
      color:var(--text);
    }

    header{
      position:sticky; top:0; z-index:20;
      backdrop-filter: blur(10px);
      background: rgba(15,23,42,.7);
      border-bottom:1px solid #1f2937;
    }
    .wrap{max-width:1200px; margin:auto; padding:18px 16px}

    .title{
      display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:space-between;
    }
    h1{font-size:clamp(20px,2.6vw,30px); margin:0; letter-spacing:.2px}
    .subtitle{color:var(--muted); font-size:14px}

    .controls{
      display:grid; grid-template-columns: 1fr 160px 140px 120px; gap:10px; margin-top:12px;
    }
    @media (max-width:720px){
      .controls{grid-template-columns:1fr 1fr}
    }
    .input, select, button{
      background:var(--soft); color:var(--text);
      border:1px solid #233049; border-radius:12px; padding:10px 12px; font-size:14px;
      outline:none;
    }
    .input::placeholder{color:#8aa0c4}
    button{cursor:pointer}
    .btn{display:inline-flex; align-items:center; gap:8px}
    .btn:hover{border-color:#2f3f66}

    .tags{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
    .tag{background:#0b2546; border:1px solid #183359; color:#9bd2ff; padding:6px 10px; border-radius:999px; font-size:12px}

    .grid{
      display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:14px; margin-top:18px;
    }

    .card{
      position:relative; overflow:hidden; border-radius:16px; background:var(--panel);
      border:1px solid #1f2a43; min-height:200px; transform:translateZ(0);
      box-shadow:0 3px 16px rgba(2,10,24,.35);
      opacity:0; translate: 0 10px; transition: opacity .4s ease, translate .4s ease;
    }
    .card.visible{opacity:1; translate:0 0}

    .card img{width:100%; height:220px; object-fit:cover; display:block; background:#0b1227}
    .card .content{padding:12px}
    .place{font-weight:700; font-size:15px; margin:0 0 6px}
    .state{font-size:12px; color:#c7d2fe}

    .chip{position:absolute; top:10px; left:10px; background:rgba(2, 6, 23, .7); color:#e2e8f0;
      padding:4px 8px; border-radius:999px; border:1px solid #1e293b; font-size:12px}

    .overlay{
      position:absolute; inset:0; display:grid; place-items:center; background:linear-gradient(180deg,transparent 40%, rgba(2,6,23,.8)); opacity:0; transition:opacity .2s ease;
    }
    .card:hover .overlay{opacity:1}
    .view-btn{
      background:linear-gradient(90deg,var(--accent),var(--accent-2)); color:black; font-weight:700; border:none; padding:10px 14px; border-radius:999px; cursor:pointer;
      box-shadow:0 10px 30px rgba(56,189,248,.35);
    }

    .stats{display:flex; gap:18px; align-items:center; font-size:13px; color:var(--muted); margin-top:6px}

    /* Lightbox */
    dialog#lightbox{ width:min(1000px, 96vw); border:none; padding:0; border-radius:16px; background:#020617; color:var(--text); overflow:hidden }
    dialog::backdrop{ background:rgba(2,6,23,.75) }
    .lightbox-head{ display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid #1f2937 }
    .lightbox-body{ padding:12px }
    .lightbox-img{ width:100%; height:70vh; max-height:70vh; object-fit:cover; display:block; background:#0b1227 }
    .x{ background:transparent; border:none; color:var(--text); font-size:22px; cursor:pointer }

    .footer{ text-align:center; color:var(--muted); padding:24px 8px }
    .sr-only{ position:absolute; left:-9999px }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div class="title">
        <div>
          <h1>100 Best Tourist Places to Visit in India</h1>
          <div class="subtitle">Search • Filter by State • View in Lightbox • Lazy-loaded grid</div>
        </div>
        <div class="stats" id="stats">Showing 0 of 0</div>
      </div>

      <div class="controls">
        <input id="search" class="input" type="search" placeholder="Search places… (e.g., Taj Mahal, Goa, Ladakh)" />
        <select id="stateFilter"></select>
        <select id="sort">
          <option value="name-asc">Sort: A → Z</option>
          <option value="name-desc">Sort: Z → A</option>
          <option value="state-asc">Sort: State A → Z</option>
          <option value="state-desc">Sort: State Z → A</option>
        </select>
        <button id="reset" class="btn">Reset</button>
      </div>

      <div class="tags" id="quickTags"></div>
    </div>
  </header>

  <main class="wrap">
    <section class="grid" id="grid" aria-live="polite"></section>
  </main>

  <dialog id="lightbox">
    <div class="lightbox-head">
      <strong id="lbTitle">Preview</strong>
      <button class="x" id="lbClose" title="Close" aria-label="Close">✕</button>
    </div>
    <div class="lightbox-body">
      <img id="lbImg" class="lightbox-img" alt="Preview" />
      <p id="lbCaption" style="margin:.6rem 0 0; color:#a5b4fc"></p>
    </div>
  </dialog>

  <footer class="footer">Made with ❤️ using vanilla HTML, CSS & JS. Images are fetched dynamically from Unsplash by keyword and may vary per load.</footer>

  <script>
    // --- Data: 100 Places (Name, State) ---
    const PLACES = [
      ["Taj Mahal", "Uttar Pradesh"],
      ["Jaipur", "Rajasthan"],
      ["Varanasi", "Uttar Pradesh"],
      ["Goa Beaches", "Goa"],
      ["Kerala Backwaters", "Kerala"],
      ["Mysore Palace", "Karnataka"],
      ["Leh-Ladakh", "Ladakh"],
      ["Darjeeling", "West Bengal"],
      ["Ranthambore National Park", "Rajasthan"],
      ["Hampi", "Karnataka"],
      ["Udaipur", "Rajasthan"],
      ["Kaziranga National Park", "Assam"],
      ["Rishikesh", "Uttarakhand"],
      ["Manali", "Himachal Pradesh"],
      ["Shimla", "Himachal Pradesh"],
      ["Golden Temple (Harmandir Sahib)", "Punjab"],
      ["Andaman & Nicobar Islands", "Andaman & Nicobar"],
      ["Khajuraho Temples", "Madhya Pradesh"],
      ["Ellora Caves", "Maharashtra"],
      ["Ajanta Caves", "Maharashtra"],
      ["Sundarbans", "West Bengal"],
      ["Konark Sun Temple", "Odisha"],
      ["Mahabalipuram", "Tamil Nadu"],
      ["Puducherry (Pondicherry)", "Puducherry"],
      ["Ooty", "Tamil Nadu"],
      ["Kodaikanal", "Tamil Nadu"],
      ["Coorg", "Karnataka"],
      ["Chikmagalur", "Karnataka"],
      ["Shillong", "Meghalaya"],
      ["Gangtok", "Sikkim"],
      ["Lonavala & Khandala", "Maharashtra"],
      ["Mount Abu", "Rajasthan"],
      ["Bodh Gaya", "Bihar"],
      ["Jaisalmer", "Rajasthan"],
      ["Rann of Kutch", "Gujarat"],
      ["Gir National Park", "Gujarat"],
      ["Dwarka", "Gujarat"],
      ["Somnath", "Gujarat"],
      ["Mahabodhi Temple", "Bihar"],
      ["Nalanda", "Bihar"],
      ["Sanchi Stupa", "Madhya Pradesh"],
      ["Bhopal", "Madhya Pradesh"],
      ["Lucknow", "Uttar Pradesh"],
      ["Prayagraj (Allahabad)", "Uttar Pradesh"],
      ["Cherrapunji", "Meghalaya"],
      ["Mawsynram", "Meghalaya"],
      ["Valley of Flowers", "Uttarakhand"],
      ["Haridwar", "Uttarakhand"],
      ["Badrinath", "Uttarakhand"],
      ["Kedarnath", "Uttarakhand"],
      ["Yamunotri", "Uttarakhand"],
      ["Gangotri", "Uttarakhand"],
      ["Gulmarg", "Jammu & Kashmir"],
      ["Pahalgam", "Jammu & Kashmir"],
      ["Srinagar", "Jammu & Kashmir"],
      ["Dalhousie", "Himachal Pradesh"],
      ["Khajjiar", "Himachal Pradesh"],
      ["Spiti Valley", "Himachal Pradesh"],
      ["Auli", "Uttarakhand"],
      ["Amarnath Cave", "Jammu & Kashmir"],
      ["Vaishno Devi", "Jammu & Kashmir"],
      ["Meenakshi Temple, Madurai", "Tamil Nadu"],
      ["Rameswaram", "Tamil Nadu"],
      ["Kanyakumari", "Tamil Nadu"],
      ["Chennai", "Tamil Nadu"],
      ["Hyderabad", "Telangana"],
      ["Charminar", "Telangana"],
      ["Golconda Fort", "Telangana"],
      ["Warangal", "Telangana"],
      ["Bhubaneswar", "Odisha"],
      ["Puri", "Odisha"],
      ["Chilika Lake", "Odisha"],
      ["Gopalpur", "Odisha"],
      ["Patna", "Bihar"],
      ["Rajgir", "Bihar"],
      ["Hornbill Festival (Kohima)", "Nagaland"],
      ["Imphal", "Manipur"],
      ["Agartala", "Tripura"],
      ["Aizawl", "Mizoram"],
      ["Itanagar", "Arunachal Pradesh"],
      ["Tawang", "Arunachal Pradesh"],
      ["Ziro Valley", "Arunachal Pradesh"],
      ["Majuli Island", "Assam"],
      ["Dibrugarh", "Assam"],
      ["Tezpur", "Assam"],
      ["Silchar", "Assam"],
      ["Lucknow Residency", "Uttar Pradesh"],
      ["Kanpur", "Uttar Pradesh"],
      ["Mathura-Vrindavan", "Uttar Pradesh"],
      ["Sanchi", "Madhya Pradesh"],
      ["Gwalior Fort", "Madhya Pradesh"],
      ["Indore", "Madhya Pradesh"],
      ["Ahmedabad", "Gujarat"],
      ["Statue of Unity", "Gujarat"],
      ["Junagadh", "Gujarat"],
      ["Porbandar", "Gujarat"],
      ["Mandvi Beach", "Gujarat"],
      ["Lakshadweep Islands", "Lakshadweep"],
      ["Rumtek & Other Monasteries", "Sikkim"],
      ["Nainital", "Uttarakhand"],
      ["Mussoorie", "Uttarakhand"],
      ["Jim Corbett National Park", "Uttarakhand"],
    ];

    // Utility to build image URL from place name using Unsplash Source (no key needed)
    const imgFor = (name) => `https://source.unsplash.com/800x600/?${encodeURIComponent(name + ', India')}`;

    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const stateFilter = document.getElementById('stateFilter');
    const sort = document.getElementById('sort');
    const resetBtn = document.getElementById('reset');
    const stats = document.getElementById('stats');
    const quickTags = document.getElementById('quickTags');

    // Build state list
    const states = Array.from(new Set(PLACES.map(([,s]) => s))).sort();
    stateFilter.innerHTML = `<option value="">Filter by State/UT</option>` + states.map(s => `<option value="${s}">${s}</option>`).join('');

    // Quick tags: popular filters
    const tagList = ["Rajasthan","Uttarakhand","Himachal Pradesh","Kerala","Tamil Nadu","Gujarat","Jammu & Kashmir","Goa"];
    quickTags.innerHTML = tagList.map(t => `<button class="tag" data-tag="${t}">${t}</button>`).join('');
    quickTags.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-tag]');
      if(!btn) return; stateFilter.value = btn.dataset.tag; search.value=''; render();
    });

    // Sorting
    function sortData(list){
      const [by,dir] = sort.value.split('-');
      const mul = dir === 'asc' ? 1 : -1;
      return list.slice().sort((a,b)=>{
        if(by==='name') return a[0].localeCompare(b[0]) * mul;
        if(by==='state') return a[1].localeCompare(b[1]) * mul;
        return 0;
      });
    }

    // Filtering
    function filterData(){
      const q = search.value.trim().toLowerCase();
      const st = stateFilter.value;
      return PLACES.filter(([name,state])=>{
        const matchesText = !q || name.toLowerCase().includes(q) || state.toLowerCase().includes(q);
        const matchesState = !st || state === st;
        return matchesText && matchesState;
      });
    }

    // Card template
    function card([name,state], idx){
      const id = `card-${idx}`;
      return `
        <article class="card" tabindex="0" data-name="${name}" data-state="${state}">
          <img src="${imgFor(name)}" alt="${name} in ${state}" loading="lazy" onerror="this.src='https://source.unsplash.com/800x600/?india,travel'"/>
          <div class="chip">${idx+1}</div>
          <div class="overlay"><button class="view-btn" data-view>View</button></div>
          <div class="content">
            <h3 class="place">${name}</h3>
            <div class="state">${state}</div>
          </div>
        </article>
      `;
    }

    // Render grid
    function render(){
      const filtered = sortData(filterData());
      grid.innerHTML = filtered.map(card).join('');
      stats.textContent = `Showing ${filtered.length} of ${PLACES.length}`;
      observeCards();
    }

    // Lazy-reveal with IntersectionObserver
    let observer;
    function observeCards(){
      if(observer) observer.disconnect();
      observer = new IntersectionObserver((entries)=>{
        entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('visible'); observer.unobserve(e.target); } });
      }, { rootMargin: '80px' });
      document.querySelectorAll('.card').forEach(el=>observer.observe(el));
    }

    // Event listeners
    search.addEventListener('input', render);
    stateFilter.addEventListener('change', render);
    sort.addEventListener('change', render);
    resetBtn.addEventListener('click', ()=>{ search.value=''; stateFilter.value=''; sort.value='name-asc'; render(); });

    // Lightbox logic
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lbImg');
    const lbTitle = document.getElementById('lbTitle');
    const lbCaption = document.getElementById('lbCaption');
    const lbClose = document.getElementById('lbClose');

    grid.addEventListener('click', (e)=>{
      const btn = e.target.closest('[data-view]');
      const cardEl = e.target.closest('.card');
      if(btn && cardEl){
        const name = cardEl.getAttribute('data-name');
        const state = cardEl.getAttribute('data-state');
        lbTitle.textContent = name;
        lbImg.src = imgFor(name);
        lbImg.alt = `${name} in ${state}`;
        lbCaption.textContent = `${name} — ${state}, India`;
        lb.showModal();
      }
    });
    lbClose.addEventListener('click', ()=> lb.close());
    lb.addEventListener('click', (e)=>{ if(e.target === lb) lb.close(); });
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape' && lb.open) lb.close(); });

    // Init
    render();
  </script>
</body>
</html>
